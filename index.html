<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sucrédito · Resolvé el súper</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow: #FFEE00;
    --yellow-deep: #E8D800;
    --red: #E30613;
    --red-deep: #B4040E;
    --ink: #1B1A1E;
    --ink-soft: #4A4850;
    --paper: #FFFDF6;
    --line: rgba(27,26,30,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Archivo Black', 'Inter', sans-serif;
    font-weight:400;
    letter-spacing:-0.01em;
  }

  /* ---------- HERO ---------- */
  .hero{
    background: var(--paper);
    position:relative;
  }
  .hero-banner{
    display:block;
    width:100%;
    height: 460px;
    object-fit: contain;
    object-position: center;
    background: #FFEE00;
  }
  @media (max-width:900px){
    .hero-banner{ height: 320px; }
  }
  @media (max-width:600px){
    .hero-banner{ height: 220px; }
  }

  /* ---------- LOCATION SELECTOR ---------- */
  .selector-wrap{
    max-width:1080px;
    margin:0 auto;
    padding: 28px 24px 8px;
  }
  .selector-label{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    font-weight:700;
    margin-bottom:14px;
  }
  .prov-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .prov-tab{
    appearance:none;
    border:2px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    padding:11px 18px;
    border-radius:12px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    transition: transform .12s ease, background .12s ease, color .12s ease;
  }
  .prov-tab:hover{ transform:translateY(-2px); }
  .prov-tab.active{
    background:var(--yellow);
    border-color:var(--yellow);
    color:var(--ink);
  }
  .prov-tab .count{
    font-weight:500;
    opacity:0.7;
    font-size:12.5px;
    margin-left:6px;
  }

  /* ---------- RESULTS ---------- */
  main{
    max-width:1080px;
    margin:0 auto;
    padding: 28px 24px 90px;
  }
  .province-heading{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin: 14px 0 4px;
  }
  .province-heading h2{
    font-size:clamp(2rem,4vw,3rem);
    margin:0;
  }
  .province-heading .sub{
    color:var(--ink-soft);
    font-size:14.5px;
  }
  .promo-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:24px;
    margin-top:26px;
  }

  .promo-card{
    border:1px solid var(--line);
    border-radius:18px;
    background:#fff;
    padding:0 14px 22px;
    min-height:330px;
    display:flex;
    flex-direction:column;
    gap:18px;
    position:relative;
    overflow:hidden;
  }

  .promo-card::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:7px;
    height:100%;
    background:var(--yellow);
  }

  /* Encabezado de cuotas: amarillo + número rojo + tipografía negra pesada */
  .cuotas-flag{
    display:flex;
    align-items:center;
    gap:14px;
    align-self:flex-start;
    width:calc(100% + 14px);
    min-height:116px;
    background:var(--yellow);
    color:var(--ink);
    padding:16px 22px 16px 26px;
    margin-left:-14px;
    border-radius:0 0 58px 0;
    position:relative;
  }

  .cuotas-flag .num{
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 72px;
    width:72px;
    height:72px;
    border-radius:14px;
    background:var(--red);
    color:#fff;
    font-family:'Archivo Black',sans-serif;
    font-size:3.1rem;
    line-height:1;
  }

  .cuotas-flag .txt{
    font-family:'Archivo Black','Inter',sans-serif;
    font-size:20px;
    font-weight:400;
    text-transform:uppercase;
    letter-spacing:-0.02em;
    max-width:190px;
    line-height:1.02;
  }

  .store-row{
    display:flex;
    flex-wrap:wrap;
    align-items:stretch;
    justify-content:center;
    gap:12px;
    flex:1;
    padding:2px 2px 0 8px;
  }

  .store-logo{
    display:flex;
    align-items:center;
    justify-content:center;
    flex:1 1 145px;
    min-width:120px;
    min-height:104px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 18px;
  }

  .store-logo img{
    max-height:76px;
    max-width:190px;
    height:auto;
    width:auto;
    object-fit:contain;
    display:block;
  }

  .store-row:has(.store-logo:only-child) .store-logo{
    flex-basis:100%;
    min-height:150px;
  }

  .store-row:has(.store-logo:only-child) .store-logo img{
    max-height:105px;
    max-width:360px;
  }

  @media (max-width:900px){
    .promo-grid{
      grid-template-columns:repeat(2,minmax(0,1fr));
    }
  }

  @media (max-width:600px){
    .promo-grid{
      grid-template-columns:1fr;
    }

    .promo-card{
      min-height:0;
    }

    .cuotas-flag{
      min-height:100px;
    }

    .cuotas-flag .num{
      flex-basis:62px;
      width:62px;
      height:62px;
      font-size:2.7rem;
    }

    .cuotas-flag .txt{
      font-size:18px;
    }

    .store-logo{
      min-height:96px;
    }

    .store-logo img{
      max-height:70px;
      max-width:180px;
    }
  }

  footer{
    background:var(--ink);
    color:rgba(255,255,255,0.7);
    padding:26px 24px;
    font-size:12.5px;
    line-height:1.6;
    text-align:center;
  }
  footer strong{color:#fff;}
  @media (max-width:600px){
    .promo-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header class="hero">
  <img src="hero_super_9-10.png" alt="Llená el carrito · Comprá hoy y pagá en Noviembre" class="hero-banner">
  <div class="selector-wrap">
    <div class="selector-label">Elegí tu localidad</div>
    <div class="prov-tabs" id="provTabs"></div>
  </div>
</header>

<main>
  <div class="province-heading">
    <h2 id="provTitle">—</h2>
    <span class="sub" id="provSub"></span>
  </div>
  <div class="promo-grid" id="promoGrid"></div>
</main>

<footer>
  Tarjeta Sucrédito propiedad de Valle Fértil S.A, Cuit 30-68570941-0 — San Martín 836, San Miguel de Tucumán.<br>
  *CFT (Costo Financiero Total) 0,0% — TNA (Tasa Nominal Anual) 0,0%. Promociones válidas durante Octubre en supermercados adheridos.
</footer>

<script>
const LOGOS = {
  marques:    "logo_el_marques.png",
  changomas:  "logo_changomas.png",
  anonima:    "logo_la_anonima.png",
  carrefour:  "logo_carrefour.png",
  sanramon:   "logo_san_ramon.png",
  vea:        "logo_vea.png",
  jumbo:      "logo_jumbo.png",
  gomezpardo: "logo_gomez_pardo.png",
  yaguar:     "logo_yaguar.png",
  churo:      "logo_el_churo.png",
  obrero:     "logo_el_obrero.png",
  comodin:    "logo_comodin.png",
  nataly:     "logo_super_nataly.png",
  mariano:    "logo_mariano_max.png",
};

const DATA = {
  TUC: {
    name: "Tucumán",
    groups: [
      { cuotas: "5", label: "cuotas sin interés", stores: [
        { logo: LOGOS.marques, alt: "Supermercado El Marques" }
      ]},
      { cuotas: "4", label: "cuotas sin interés", stores: [
        { logo: LOGOS.changomas, alt: "ChangoMás" },
        { logo: LOGOS.anonima,   alt: "La Anónima" },
        { logo: LOGOS.sanramon,  alt: "San Ramón" },
        { logo: LOGOS.carrefour, alt: "Carrefour" }
      ]},
      { cuotas: "3", label: "cuotas sin interés", stores: [
        { logo: LOGOS.vea,        alt: "Vea" },
        { logo: LOGOS.jumbo,      alt: "Jumbo" },
        { logo: LOGOS.gomezpardo, alt: "Gómez Pardo" }
      ]}
    ]
  },
  COR: {
    name: "Córdoba",
    groups: [
      { cuotas: "4", label: "cuotas sin interés", stores: [
        { logo: LOGOS.changomas, alt: "ChangoMás" },
        { logo: LOGOS.carrefour, alt: "Carrefour" },
        { logo: LOGOS.anonima,   alt: "La Anónima" }
      ]},
      { cuotas: "3", label: "cuotas sin interés", stores: [
        { logo: LOGOS.vea,     alt: "Vea" },
        { logo: LOGOS.jumbo,   alt: "Jumbo" },
        { logo: LOGOS.mariano, alt: "Mariano Max" }
      ]}
    ]
  },
  SGO: {
    name: "Santiago del Estero",
    groups: [
      { cuotas: "4", label: "cuotas sin interés", stores: [
        { logo: LOGOS.changomas, alt: "ChangoMás" },
        { logo: LOGOS.carrefour, alt: "Carrefour" },
        { logo: LOGOS.anonima,   alt: "La Anónima" }
      ]},
      { cuotas: "3", label: "cuotas sin interés", stores: [
        { logo: LOGOS.vea,    alt: "Vea" },
        { logo: LOGOS.nataly, alt: "Super Nataly" }
      ]}
    ]
  },
  SANP: {
    name: "San Pedro de Jujuy",
    groups: [
      { cuotas: "4", label: "cuotas sin interés", stores: [
        { logo: LOGOS.changomas, alt: "ChangoMás" },
        { logo: LOGOS.churo,     alt: "Supermercados El Churo" }
      ]},
      { cuotas: "3", label: "cuotas sin interés", stores: [
        { logo: LOGOS.obrero,  alt: "Supermercado El Obrero" },
        { logo: LOGOS.comodin, alt: "Comodín" }
      ]}
    ]
  },
  ORAN: {
    name: "Orán",
    groups: [
      { cuotas: "4", label: "cuotas sin interés", stores: [
        { logo: LOGOS.changomas, alt: "ChangoMás" }
      ]},
      { cuotas: "3", label: "cuotas sin interés", stores: [
        { logo: LOGOS.comodin, alt: "Comodín" },
        { logo: LOGOS.vea,     alt: "Vea" }
      ]}
    ]
  },
  JUJ: {
    name: "Jujuy",
    groups: [
      { cuotas: "4", label: "cuotas sin interés", stores: [
        { logo: LOGOS.changomas, alt: "ChangoMás" },
        { logo: LOGOS.yaguar,    alt: "Mayorista Yaguar" },
        { logo: LOGOS.carrefour, alt: "Carrefour" }
      ]},
      { cuotas: "3", label: "cuotas sin interés", stores: [
        { logo: LOGOS.comodin, alt: "Comodín" },
        { logo: LOGOS.vea,     alt: "Vea" }
      ]}
    ]
  },
  SAL: {
    name: "Salta",
    groups: [
      { cuotas: "4", label: "cuotas sin interés", stores: [
        { logo: LOGOS.anonima,   alt: "La Anónima" },
        { logo: LOGOS.changomas, alt: "ChangoMás" },
        { logo: LOGOS.carrefour, alt: "Carrefour" },
        { logo: LOGOS.yaguar,    alt: "Mayorista Yaguar" }
      ]},
      { cuotas: "3", label: "cuotas sin interés", stores: [
        { logo: LOGOS.vea,   alt: "Vea" },
        { logo: LOGOS.jumbo, alt: "Jumbo" }
      ]}
    ]
  },
  CONC: {
    name: "Concepción",
    groups: [
      { cuotas: "4", label: "cuotas sin interés", stores: [
        { logo: LOGOS.changomas, alt: "ChangoMás" }
      ]},
      { cuotas: "3", label: "cuotas sin interés", stores: [
        { logo: LOGOS.gomezpardo, alt: "Gómez Pardo" }
      ]}
    ]
  }
};

const tabsEl  = document.getElementById('provTabs');
const gridEl  = document.getElementById('promoGrid');
const titleEl = document.getElementById('provTitle');
const subEl   = document.getElementById('provSub');

function render(key){
  const loc = DATA[key];
  const totalStores = loc.groups.reduce((sum, g) => sum + g.stores.length, 0);
  titleEl.textContent = loc.name;
  subEl.textContent = totalStores + (totalStores === 1 ? " supermercado adherido" : " supermercados adheridos");
  gridEl.innerHTML = '';
  loc.groups.forEach(g => {
    const card = document.createElement('div');
    card.className = 'promo-card';
    const storesHtml = g.stores.map(s => `<span class="store-logo"><img src="${s.logo}" alt="${s.alt}"></span>`).join('');
    card.innerHTML = `
      <span class="cuotas-flag">
        <span class="num">${g.cuotas}</span>
        <span class="txt">${g.label}</span>
      </span>
      <div class="store-row">${storesHtml}</div>
    `;
    gridEl.appendChild(card);
  });
  document.querySelectorAll('.prov-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.key === key);
  });
  history.replaceState(null, '', '#' + key.toLowerCase());
}

Object.keys(DATA).forEach(key => {
  const btn = document.createElement('button');
  btn.className = 'prov-tab';
  btn.dataset.key = key;
  const count = DATA[key].groups.reduce((sum, g) => sum + g.stores.length, 0);
  btn.innerHTML = DATA[key].name + ` <span class="count">${count}</span>`;
  btn.addEventListener('click', () => render(key));
  tabsEl.appendChild(btn);
});

const hashKey = location.hash.replace('#','').toUpperCase();
render(DATA[hashKey] ? hashKey : 'TUC');
</script>

</body>
</html>
